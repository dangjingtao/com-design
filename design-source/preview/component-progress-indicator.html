<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Indicator · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-12); background: var(--color-background); font-family: var(--font-family-base); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-16); }
  .story { display: flex; flex-direction: column; gap: var(--space-8); }
  .rail { display: flex; gap: var(--space-16); align-items: center; flex-wrap: wrap; }
  .story-label { font: var(--type-label-small); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
  .surface-card { background: var(--color-surface); border-radius: var(--radius-container); padding: var(--space-12); border: 1px solid var(--color-border-subtle); width: 100%; box-sizing: border-box; }

  /* @component-css-start */
  .progress { display: flex; flex-direction: column; gap: var(--space-4); }
  .progress--block { width: 100%; }
  .progress__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
  .progress__label { font: var(--type-body-small); color: var(--color-text-primary); white-space: nowrap; }
  .progress__value { font: var(--type-caption); color: var(--color-text-tertiary); white-space: nowrap; }
  .progress__track { width: 100%; height: 4px; background: var(--color-surface-subtle); border-radius: var(--radius-pill); overflow: hidden; }
  .progress__fill { height: 100%; background: var(--color-primary); border-radius: var(--radius-pill); }
  .progress--circular { flex-direction: row; align-items: center; gap: var(--space-8); }
  .progress__ring { position: relative; width: 24px; height: 24px; flex-shrink: 0; }
  .progress__ring svg { display: block; transform: rotate(-90deg); }
  .progress__ring-track { fill: none; stroke: var(--color-surface-subtle); stroke-width: 2.5; }
  .progress__ring-arc { fill: none; stroke: var(--color-primary); stroke-width: 2.5; stroke-linecap: round; }
  .progress__ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: var(--type-caption); color: var(--color-text-secondary); }
  .progress__below { font: var(--type-caption); color: var(--color-text-tertiary); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">

  <div class="story" data-evidence-sample="linear">
    <span class="story-label">线性</span>
    <div class="surface-card">
      <div class="progress progress--block">
        <div class="progress__row">
          <span class="progress__label">存储空间</span>
          <span class="progress__value">68%</span>
        </div>
        <div class="progress__track" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100">
          <div class="progress__fill" style="width:68%"></div>
        </div>
      </div>
    </div>
    <div class="surface-card">
      <div class="progress progress--block">
        <div class="progress__track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <div class="progress__fill" style="width:100%"></div>
        </div>
        <span class="progress__below">完成</span>
      </div>
    </div>
    <div class="surface-card">
      <div class="progress progress--block">
        <div class="progress__track" role="progressbar" aria-valuenow="32" aria-valuemin="0" aria-valuemax="100">
          <div class="progress__fill" style="width:32%"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="story" data-evidence-sample="circular">
    <span class="story-label">环形</span>
    <div class="rail surface-card">
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-4)">
        <span class="progress__ring" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <circle class="progress__ring-track" cx="12" cy="12" r="10.75"/>
            <circle class="progress__ring-arc" cx="12" cy="12" r="10.75" stroke-dasharray="16.89 67.54"/>
          </svg>
        </span>
        <span class="progress__below">同步中</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-4)">
        <span class="progress__ring" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <circle class="progress__ring-track" cx="12" cy="12" r="10.75"/>
            <circle class="progress__ring-arc" cx="12" cy="12" r="10.75" stroke-dasharray="40.53 67.54"/>
          </svg>
        </span>
        <span class="progress__below">处理中</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-4)">
        <span class="progress__ring" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <circle class="progress__ring-track" cx="12" cy="12" r="10.75"/>
            <circle class="progress__ring-arc" cx="12" cy="12" r="10.75" stroke-dasharray="67.54 67.54"/>
          </svg>
          <span class="progress__ring-label">100%</span>
        </span>
        <span class="progress__below">已完成</span>
      </div>
    </div>
  </div>

  <div class="story" data-evidence-sample="labeled">
    <span class="story-label">带标签</span>
    <div class="surface-card" style="max-width:320px">
      <div class="progress progress--block">
        <div class="progress__row">
          <span class="progress__label">上传中…</span>
          <span class="progress__value">75%</span>
        </div>
        <div class="progress__track" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="progress__fill" style="width:75%"></div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
