<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<title>Select · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: var(--space-16); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-20); max-width: 390px; }
  .stage { display: flex; flex-direction: column; gap: var(--space-16); }
  .story { display: flex; flex-direction: column; gap: var(--space-12); }
  .story-label { font: var(--type-label-small); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: .04em; }
  .story-note { margin: calc(var(--space-4) * -1) 0 0; font: var(--type-body-small); color: var(--color-text-secondary); line-height: 1.5; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* @component-css-start */
  .select { display: flex; flex-direction: column; gap: var(--space-6); }
  .select-label { font: var(--type-label); color: var(--color-text-primary); }
  .select-helper { font: var(--type-body-small); color: var(--color-text-tertiary); }
  .select-trigger { display: flex; align-items: center; gap: var(--space-8); width: 100%; min-height: var(--size-control-height); padding: 0 var(--space-12); border: var(--com-border-control) solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface); color: var(--color-text-primary); font: var(--type-body); text-align: left; cursor: pointer; user-select: none; transition: background .15s, border-color .15s, border-width .15s; }
  .select-trigger::-moz-focus-inner { border: 0; }
  .select-trigger:focus { outline: none; }
  .select-trigger:focus-visible { border-color: var(--color-border-focused); box-shadow: 0 0 0 2px var(--color-primary-container); }
  .select-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .select-placeholder { color: var(--color-text-placeholder); }
  .select-chevron { flex: 0 0 auto; width: var(--size-icon-md); height: var(--size-icon-md); color: var(--color-text-tertiary); transition: transform .15s; }
  .select.is-open .select-trigger { border-width: var(--com-border-focus); border-color: var(--color-border-focused); padding-left: 11px; padding-right: 11px; }
  .select.is-open .select-chevron { transform: rotate(180deg); }
  .select-trigger:active { background: var(--color-surface-pressed); }
  .select.is-error .select-trigger { border-color: var(--color-border-error); }
  .select.is-error .select-trigger:focus-visible, .select.is-error.is-open .select-trigger { border-color: var(--color-border-error); box-shadow: 0 0 0 2px var(--color-danger-bg); }
  .select.is-disabled .select-trigger { background: var(--color-surface-subtle); border-color: var(--color-border-subtle); cursor: not-allowed; }
  .select.is-disabled .select-value, .select.is-disabled .select-placeholder, .select.is-disabled .select-chevron { color: var(--color-text-disabled); }
  .select-error { font: var(--type-body-small); color: var(--color-danger-text); }

  .select-sheet-layer { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--color-scrim); }
  .select-sheet { width: min(100%, 390px); max-height: min(72vh, 560px); overflow: hidden; border-radius: var(--radius-overlay) var(--radius-overlay) 0 0; background: var(--color-surface); box-shadow: var(--shadow-2); }
  .select-sheet-handle { width: 36px; height: 4px; margin: var(--space-8) auto var(--space-4); border-radius: 999px; background: var(--color-border); }
  .select-sheet-header { display: flex; min-height: 52px; align-items: center; gap: var(--space-8); padding: 0 var(--space-8) 0 var(--space-16); border-bottom: 1px solid var(--color-border-subtle); }
  .select-sheet-title { flex: 1; min-width: 0; margin: 0; font: var(--type-heading-small); color: var(--color-text-primary); }
  .select-sheet-close { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
  .select-sheet-close:active { background: var(--color-surface-pressed); }
  .select-sheet-close:focus-visible { outline: 2px solid var(--color-border-focused); outline-offset: -2px; }
  .select-options { max-height: min(56vh, 430px); overflow-y: auto; overscroll-behavior: contain; padding: var(--space-4) var(--space-8) calc(var(--space-12) + env(safe-area-inset-bottom)); }
  .select-option { display: flex; min-height: 52px; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-8); border-radius: var(--radius-control); color: var(--color-text-primary); cursor: pointer; outline: none; }
  .select-option + .select-option { margin-top: 2px; }
  .select-option:hover { background: var(--color-surface-subtle); }
  .select-option:focus-visible { box-shadow: inset 0 0 0 2px var(--color-border-focused); }
  .select-option[aria-selected="true"] { background: var(--color-primary-container); color: var(--color-text-brand); font-weight: 600; }
  .select-option[aria-disabled="true"] { color: var(--color-text-disabled); cursor: not-allowed; }
  .select-option[aria-disabled="true"]:hover { background: transparent; }
  .select-option-label { flex: 1; min-width: 0; }
  .select-option-meta { display: block; margin-top: 2px; font: var(--type-body-small); color: var(--color-text-tertiary); font-weight: 400; }
  .select-check { width: var(--size-icon-md); height: var(--size-icon-md); flex: 0 0 auto; opacity: 0; }
  .select-option[aria-selected="true"] .select-check { opacity: 1; }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen" id="select-demo-content">
  <div class="stage">
    <div class="story">
      <span class="story-label">完整 Select · Interactive</span>
      <p class="story-note">点击字段打开 Bottom Sheet。这里演示的是同一个 Select 的 touch-first presentation adapter，不是一个只会转箭头的 Trigger。</p>

      <div class="select" id="department-select" data-evidence-sample="interactive">
        <label class="select-label" id="department-label">所在部门</label>
        <button
          type="button"
          class="select-trigger"
          id="department-trigger"
          aria-labelledby="department-label department-value"
          aria-describedby="department-helper"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="department-sheet"
        >
          <span class="select-value select-placeholder" id="department-value">请选择部门</span>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="select-helper" id="department-helper">单选；选择后立即提交并关闭</span>
      </div>
    </div>

    <div class="story">
      <span class="story-label">Validation</span>
      <div class="select is-error" data-evidence-sample="error">
        <label class="select-label" id="expense-label">费用类型</label>
        <button type="button" class="select-trigger" aria-labelledby="expense-label expense-value" aria-describedby="expense-error" aria-haspopup="dialog" aria-expanded="false" aria-invalid="true">
          <span class="select-value select-placeholder" id="expense-value">请选择费用类型</span>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="select-error" id="expense-error">请选择费用类型</span>
      </div>
    </div>

    <div class="story">
      <span class="story-label">Disabled</span>
      <div class="select is-disabled" data-evidence-sample="disabled">
        <label class="select-label" id="company-label">归属公司</label>
        <button type="button" class="select-trigger" aria-labelledby="company-label company-value" aria-haspopup="dialog" aria-expanded="false" disabled>
          <span class="select-value" id="company-value">Com Design（不可修改）</span>
          <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="select-sheet-layer" id="department-sheet" hidden>
  <section class="select-sheet" role="dialog" aria-modal="true" aria-labelledby="department-sheet-title">
    <div class="select-sheet-handle" aria-hidden="true"></div>
    <header class="select-sheet-header">
      <h2 class="select-sheet-title" id="department-sheet-title">选择所在部门</h2>
      <button class="select-sheet-close" type="button" id="department-close" aria-label="关闭选择器">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="select-options" id="department-listbox" role="listbox" aria-labelledby="department-sheet-title">
      <div class="select-option" role="option" tabindex="-1" aria-selected="false" data-value="design" data-label="设计部">
        <span class="select-option-label">设计部<span class="select-option-meta">Design</span></span>
        <svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </div>
      <div class="select-option" role="option" tabindex="-1" aria-selected="false" data-value="product" data-label="产品部">
        <span class="select-option-label">产品部<span class="select-option-meta">Product</span></span>
        <svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </div>
      <div class="select-option" role="option" tabindex="-1" aria-selected="false" data-value="engineering" data-label="研发部">
        <span class="select-option-label">研发部<span class="select-option-meta">Engineering</span></span>
        <svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </div>
      <div class="select-option" role="option" tabindex="-1" aria-selected="false" data-value="operations" data-label="运营部">
        <span class="select-option-label">运营部<span class="select-option-meta">Operations</span></span>
        <svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </div>
      <div class="select-option" role="option" tabindex="-1" aria-selected="false" aria-disabled="true" data-value="finance" data-label="财务部">
        <span class="select-option-label">财务部<span class="select-option-meta">当前账号不可选择</span></span>
        <svg class="select-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </div>
    </div>
  </section>
</div>

<div class="sr-only" id="select-status" role="status" aria-live="polite"></div>

<script>
  const root = document.querySelector('#department-select');
  const content = document.querySelector('#select-demo-content');
  const trigger = document.querySelector('#department-trigger');
  const valueNode = document.querySelector('#department-value');
  const layer = document.querySelector('#department-sheet');
  const closeButton = document.querySelector('#department-close');
  const options = [...document.querySelectorAll('#department-listbox .select-option')];
  const status = document.querySelector('#select-status');
  let committedValue = null;
  let lastFocusedOption = null;

  function enabledOptions(){
    return options.filter(option => option.getAttribute('aria-disabled') !== 'true');
  }

  function selectedOption(){
    return options.find(option => option.dataset.value === committedValue) || null;
  }

  function renderSelection(){
    options.forEach(option => option.setAttribute('aria-selected', String(option.dataset.value === committedValue)));
    const selected = selectedOption();
    if(selected){
      valueNode.textContent = selected.dataset.label;
      valueNode.classList.remove('select-placeholder');
    }else{
      valueNode.textContent = '请选择部门';
      valueNode.classList.add('select-placeholder');
    }
  }

  function openSelect(){
    layer.hidden = false;
    root.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    content.inert = true;
    const target = selectedOption() || enabledOptions()[0];
    lastFocusedOption = target;
    requestAnimationFrame(() => target?.focus());
  }

  function closeSelect({restoreFocus = true} = {}){
    if(layer.hidden) return;
    layer.hidden = true;
    root.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    content.inert = false;
    if(restoreFocus) requestAnimationFrame(() => trigger.focus());
  }

  function commitOption(option){
    if(!option || option.getAttribute('aria-disabled') === 'true') return;
    committedValue = option.dataset.value;
    renderSelection();
    status.textContent = `已选择${option.dataset.label}`;
    closeSelect();
  }

  function moveOptionFocus(current, delta){
    const enabled = enabledOptions();
    const index = enabled.indexOf(current);
    if(index < 0) return;
    const next = enabled[(index + delta + enabled.length) % enabled.length];
    lastFocusedOption = next;
    next.focus();
  }

  trigger.addEventListener('click', openSelect);
  trigger.addEventListener('keydown', event => {
    if(['ArrowDown','ArrowUp'].includes(event.key)){
      event.preventDefault();
      openSelect();
    }
  });

  closeButton.addEventListener('click', () => closeSelect());
  layer.addEventListener('click', event => {
    if(event.target === layer) closeSelect();
  });

  options.forEach(option => {
    option.addEventListener('click', () => commitOption(option));
    option.addEventListener('keydown', event => {
      if(event.key === 'ArrowDown'){
        event.preventDefault();
        moveOptionFocus(option, 1);
      }else if(event.key === 'ArrowUp'){
        event.preventDefault();
        moveOptionFocus(option, -1);
      }else if(event.key === 'Home'){
        event.preventDefault();
        const target = enabledOptions()[0];
        lastFocusedOption = target;
        target?.focus();
      }else if(event.key === 'End'){
        event.preventDefault();
        const list = enabledOptions();
        const target = list[list.length - 1];
        lastFocusedOption = target;
        target?.focus();
      }else if(event.key === 'Enter' || event.key === ' '){
        event.preventDefault();
        commitOption(option);
      }
    });
  });

  document.addEventListener('keydown', event => {
    if(layer.hidden) return;
    if(event.key === 'Escape'){
      event.preventDefault();
      closeSelect();
      return;
    }
    if(event.key === 'Tab'){
      const focusables = [closeButton, ...enabledOptions()];
      const activeIndex = focusables.indexOf(document.activeElement);
      if(event.shiftKey && activeIndex <= 0){
        event.preventDefault();
        focusables[focusables.length - 1].focus();
      }else if(!event.shiftKey && activeIndex === focusables.length - 1){
        event.preventDefault();
        focusables[0].focus();
      }
    }
  });

  renderSelection();
</script>
</body>
</html>
