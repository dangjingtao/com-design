<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom Navigation · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 24px; background: #E2E6F0; font-family: var(--font-family-base); display: flex; justify-content: center; }
  .phone { position: relative; width: 390px; height: 720px; background: var(--color-background); overflow: hidden; border-radius: var(--radius-lg); }
  .page-content { padding: var(--space-20); }
  .page-content h1 { font: var(--type-heading); color: var(--color-text-primary); margin: 0 0 var(--space-12); }
  .page-content p { font: var(--type-body-small); color: var(--color-text-secondary); margin: 0 0 var(--space-8); }

  /* @component-css-start */
  .bottom-nav { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; background: var(--color-surface); border-top: 1px solid var(--color-border-subtle); }
  .bn-item { flex: 1 1 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; padding: 8px 4px; cursor: pointer; color: var(--color-text-tertiary); }
  .bn-item:active { background: var(--color-surface-pressed); }
  .bn-item.is-active { color: var(--color-text-brand); }
  .bn-icon { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bn-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bn-label { font: var(--type-label-small); white-space: nowrap; }
  .bn-badge { position: absolute; top: -4px; right: -8px; display: flex; align-items: center; justify-content: center; background: var(--color-danger); color: var(--color-text-inverse); }
  .bn-badge-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); font: var(--type-label-small); box-sizing: border-box; }
  .bn-badge-dot { width: 8px; height: 8px; border-radius: var(--radius-pill); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="phone">
    <div class="page-content">
      <h1>首页</h1>
      <p>欢迎回来，今天有新的工作动态与消息提醒。</p>
      <p>底部导航固定在页面底部，提供四个顶级目的地。当前选中项使用品牌靛蓝色，未选中项使用三级文字色。</p>
    </div>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="bn-item is-active" type="button" aria-current="page">
        <span class="bn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </span>
        <span class="bn-label">首页</span>
      </button>
      <button class="bn-item" type="button">
        <span class="bn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2z"/></svg>
        </span>
        <span class="bn-label">发现</span>
      </button>
      <button class="bn-item" type="button">
        <span class="bn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
          <span class="bn-badge bn-badge-count">8</span>
        </span>
        <span class="bn-label">消息</span>
      </button>
      <button class="bn-item" type="button">
        <span class="bn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="bn-badge bn-badge-dot"></span>
        </span>
        <span class="bn-label">我的</span>
      </button>
    </nav>
  </div>
</body>
</html>
