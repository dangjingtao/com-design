<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Item · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:12px;background:var(--color-surface-subtle);font-family:var(--font-family-base);color:var(--color-text-primary)}
  .specimen{display:flex;flex-direction:column;gap:12px;max-width:390px;margin:0 auto}
  .story{display:flex;flex-direction:column;gap:8px}
  .story-label{font:var(--type-label-small);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
  .rail{display:flex;flex-direction:column}

  /* @component-css-start */
  .menu{display:flex;flex-direction:column;background:var(--color-surface);border-radius:var(--radius-overlay);box-shadow:var(--shadow-1);padding:4px 0;min-width:200px;max-width:240px}
  .menu-divider{height:8px;position:relative;flex-shrink:0}
  .menu-divider::after{content:"";position:absolute;top:3px;left:12px;right:12px;height:1px;background:var(--color-border-subtle)}
  .mi{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;background:transparent;border:none;width:100%;text-align:left;cursor:pointer;color:var(--color-text-primary)}
  .mi:hover{background:var(--color-surface-pressed)}
  .mi.is-pressed{background:var(--color-surface-pressed)}
  .mi.is-selected{color:var(--color-text-brand)}
  .mi.is-selected .mi-trail{display:flex}
  .mi.is-disabled{color:var(--color-text-disabled);cursor:not-allowed}
  .mi.is-disabled:hover{background:transparent}
  .mi.is-destructive{color:var(--color-danger-text)}
  .mi.is-destructive .mi-icon{color:var(--color-danger)}
  .mi-icon{flex:0 0 auto;display:flex;align-items:center;color:var(--color-text-secondary)}
  .mi.is-selected .mi-icon{color:var(--color-text-brand)}
  .mi-label{flex:1 1 auto;min-width:0;font:var(--type-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mi-trail{flex:0 0 auto;display:none;align-items:center;color:var(--color-text-brand)}
  .mi svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-folder-input" viewBox="0 0 24 24"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.9 1.2a2 2 0 0 0 1.7.9H20a2 2 0 0 1 2 2v3"/><path d="M2 13v4a2 2 0 0 0 2 2h6"/><path d="m11 14 3 3-3 3"/><path d="M14 17H2"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
</svg>
<div class="specimen">
  <div class="story">
    <span class="story-label">操作菜单</span>
    <div class="rail">
      <div class="menu" role="menu">
        <button class="mi" data-evidence-sample="default" role="menuitem">
          <span class="mi-icon"><svg><use href="#i-pencil"/></svg></span>
          <span class="mi-label">重命名</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
        <button class="mi" data-evidence-sample="default" role="menuitem">
          <span class="mi-icon"><svg><use href="#i-folder-input"/></svg></span>
          <span class="mi-label">移动到…</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
        <button class="mi is-pressed" data-evidence-sample="pressed" role="menuitem">
          <span class="mi-icon"><svg><use href="#i-link"/></svg></span>
          <span class="mi-label">复制链接</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
        <div class="menu-divider" aria-hidden="true"></div>
        <button class="mi is-selected" data-evidence-sample="selected" role="menuitemcheckbox" aria-checked="true">
          <span class="mi-label">紧凑模式</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
        <button class="mi is-destructive" data-evidence-sample="destructive" role="menuitem">
          <span class="mi-icon"><svg><use href="#i-trash"/></svg></span>
          <span class="mi-label">删除</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
      </div>
    </div>
  </div>
  <div class="story">
    <span class="story-label">禁用项</span>
    <div class="rail">
      <div class="menu" role="menu">
        <button class="mi" data-evidence-sample="default" role="menuitem">
          <span class="mi-icon"><svg><use href="#i-share"/></svg></span>
          <span class="mi-label">转发</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
        <button class="mi is-disabled" data-evidence-sample="disabled" role="menuitem" disabled>
          <span class="mi-icon"><svg><use href="#i-archive"/></svg></span>
          <span class="mi-label">归档(无权限)</span>
          <span class="mi-trail"><svg><use href="#i-check"/></svg></span>
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
