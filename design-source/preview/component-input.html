<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Input / Text Field — com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-12); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-16); max-width: 390px; }
  .stage { display: flex; flex-direction: column; gap: var(--space-16); }
  .story { display: flex; flex-direction: column; gap: var(--space-8); }
  .story-label { font: var(--type-label-small); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: .04em; }
  .divider { border: none; border-top: 1px solid var(--color-border-subtle); margin: var(--space-4) 0; }

  /* @component-css-start */
  .field { display: flex; flex-direction: column; gap: var(--space-6); }
  .field-label { font: var(--type-label); color: var(--color-text-primary); }
  .control { display: flex; align-items: center; height: var(--size-control-height); padding: 0 var(--space-12); border: var(--com-border-control) solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface); transition: border-color .15s, border-width .15s; }
  .control input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: var(--type-body); color: var(--color-text-primary); padding: 0; }
  .control input::placeholder { color: var(--color-text-placeholder); }
  .control:focus-within { border-width: var(--com-border-focus); border-color: var(--color-border-focused); padding-left: 11px; padding-right: 11px; }
  .is-focused .control { border-width: var(--com-border-focus); border-color: var(--color-border-focused); padding-left: 11px; padding-right: 11px; }
  .is-error .control { border-color: var(--color-border-error); }
  .is-error .control:focus-within { border-color: var(--color-border-error); }
  .is-disabled .control { background: var(--color-surface-subtle); border-color: var(--color-border-subtle); }
  .is-disabled .control input { color: var(--color-text-disabled); cursor: not-allowed; }
  .is-readonly .control input { color: var(--color-text-primary); cursor: default; }
  .field-helper { font: var(--type-body-small); color: var(--color-text-secondary); }
  .field-error { font: var(--type-body-small); color: var(--color-danger-text); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">标准输入</span>
      <label class="field" data-evidence-sample="default">
        <span class="field-label">用户名</span>
        <span class="control"><input type="text" placeholder="请输入用户名"></span>
        <span class="field-helper">用于登录的账号</span>
      </label>
      <label class="field is-focused" data-evidence-sample="focused">
        <span class="field-label">邮箱</span>
        <span class="control"><input type="email" placeholder="name@example.com" value="" autofocus></span>
      </label>
      <label class="field is-error" data-evidence-sample="error">
        <span class="field-label">手机号</span>
        <span class="control"><input type="tel" value="1380" aria-invalid="true"></span>
        <span class="field-error">请输入有效的 11 位手机号</span>
      </label>
    </div>
    <hr class="divider">
    <div class="story">
      <span class="story-label">不可编辑状态</span>
      <label class="field is-disabled" data-evidence-sample="disabled">
        <span class="field-label">设备编号</span>
        <span class="control"><input type="text" value="DEV-2026-001" disabled></span>
      </label>
      <label class="field is-readonly" data-evidence-sample="readonly">
        <span class="field-label">订单号</span>
        <span class="control"><input type="text" value="COM-20260809-8821" readonly></span>
      </label>
    </div>
  </div>
</div>
</body>
</html>
