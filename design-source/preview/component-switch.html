<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-family-base);color:var(--color-text-primary)}
  .specimen{display:flex;flex-direction:column;gap:12px;max-width:390px;margin:0 auto}
  .story{display:flex;flex-direction:column;gap:8px}
  .story-label{font:var(--type-label-small);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
  .rail{display:flex;flex-direction:column}
  .list{background:var(--color-surface);border-radius:var(--radius-container);overflow:hidden}

  /* @component-css-start */
  .switch-row{display:flex;align-items:center;gap:var(--space-12);min-height:48px;padding:8px 12px;background:var(--color-surface);position:relative;cursor:pointer}
  .switch-row + .switch-row::before{content:"";position:absolute;top:0;left:12px;right:0;height:1px;background:var(--color-border-subtle)}
  .switch-row.is-disabled{cursor:not-allowed}
  .switch-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .switch-title{font:var(--type-body);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-helper{font:var(--type-body-small);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-row.is-disabled .switch-title,.switch-row.is-disabled .switch-helper{color:var(--color-text-disabled)}
  .switch-control{flex:0 0 auto;width:44px;height:24px;position:relative;flex-shrink:0}
  .switch-input{position:absolute;opacity:0;width:44px;height:24px;margin:0}
  .switch-track{display:block;width:44px;height:24px;border-radius:var(--radius-pill);background:var(--color-surface-subtle);border:1px solid var(--color-border);box-sizing:border-box;position:relative;transition:background .15s,border-color .15s}
  .switch-thumb{position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--color-surface);transition:transform .15s}
  .switch-input:checked + .switch-track{background:var(--color-primary);border-color:var(--color-primary)}
  .switch-input:checked + .switch-track .switch-thumb{transform:translateX(18px)}
  .switch-input:disabled:not(:checked) + .switch-track{background:var(--color-surface-subtle);border-color:var(--color-border-subtle)}
  .switch-input:disabled:checked + .switch-track{background:var(--color-disabled);border-color:var(--color-disabled)}
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="story">
    <span class="story-label">开关设置</span>
    <div class="rail">
      <div class="list">
        <label class="switch-row" data-evidence-sample="on">
          <span class="switch-text"><span class="switch-title">推送通知</span><span class="switch-helper">审核结果与任务提醒</span></span>
          <span class="switch-control">
            <input type="checkbox" class="switch-input" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
        <label class="switch-row" data-evidence-sample="off">
          <span class="switch-text"><span class="switch-title">邮件摘要</span><span class="switch-helper">每周一上午发送汇总</span></span>
          <span class="switch-control">
            <input type="checkbox" class="switch-input">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
        <label class="switch-row is-disabled" data-evidence-sample="disabled-on">
          <span class="switch-text"><span class="switch-title">企业安全策略</span><span class="switch-helper">由管理员强制开启</span></span>
          <span class="switch-control">
            <input type="checkbox" class="switch-input" checked disabled>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
        <label class="switch-row is-disabled" data-evidence-sample="disabled-off">
          <span class="switch-text"><span class="switch-title">Beta 实验功能</span><span class="switch-helper">当前账号暂不可用</span></span>
          <span class="switch-control">
            <input type="checkbox" class="switch-input" disabled>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </div>
    </div>
  </div>
</div>
</body>
</html>
