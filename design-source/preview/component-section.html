<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-family-base);color:var(--color-text-primary)}
  .specimen{display:flex;flex-direction:column;gap:12px;max-width:390px;margin:0 auto}
  .story{display:flex;flex-direction:column;gap:8px}
  .story-label{font:var(--type-label-small);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
  .rail{display:flex;flex-direction:column}

  /* @component-css-start */
  .section{display:flex;flex-direction:column;gap:var(--space-8);background:none;border:none;box-shadow:none}
  .section + .section{margin-top:var(--space-20)}
  .section-header{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-12);padding:0 var(--space-12)}
  .section-titles{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
  .section-title{font:var(--type-heading-small);color:var(--color-text-primary);margin:0}
  .section-supporting{font:var(--type-body-small);color:var(--color-text-secondary);margin:0}
  .section-action{font:var(--type-label);color:var(--color-text-brand);background:none;border:none;padding:0;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .section-action:hover{color:var(--color-primary-hover)}
  .section-content{display:flex;flex-direction:column;gap:var(--space-8)}
  .list-card{background:var(--color-surface);border-radius:var(--radius-container);overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);height:48px;padding:0 var(--space-12);background:var(--color-surface);position:relative}
  .row + .row::before{content:"";position:absolute;top:0;left:var(--space-12);right:0;height:1px;background:var(--color-border-subtle)}
  .row-label{font:var(--type-body);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch{flex:0 0 auto;width:44px;height:24px;border-radius:var(--radius-pill);background:var(--color-primary);position:relative}
  .switch::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:var(--radius-pill);background:var(--color-on-primary)}
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="story">
    <span class="story-label">设置分组</span>
    <div class="rail">
      <section class="section" data-evidence-sample="with-header-trailing">
        <header class="section-header">
          <div class="section-titles"><h3 class="section-title">账号</h3></div>
          <button type="button" class="section-action">管理</button>
        </header>
        <div class="section-content">
          <div class="list-card">
            <div class="row"><span class="row-label">登录设备</span></div>
            <div class="row"><span class="row-label">第三方绑定</span></div>
          </div>
        </div>
      </section>
      <section class="section" data-evidence-sample="with-header-supporting">
        <header class="section-header">
          <div class="section-titles">
            <h3 class="section-title">通知</h3>
            <p class="section-supporting">管理推送与免打扰</p>
          </div>
        </header>
        <div class="section-content">
          <div class="list-card">
            <div class="row"><span class="row-label">消息通知</span><span class="switch" aria-hidden="true"></span></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
</body>
</html>
