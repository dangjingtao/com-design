<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empty State · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding:var(--space-12); background:var(--color-background); font-family:var(--font-family-base); }
.phone-list { display:flex; flex-direction:column; gap:var(--space-16); align-items:center; }

/* @component-css-start */
.phone { width:340px; max-width:100%; background:var(--color-surface); border-radius:var(--radius-container); padding:var(--space-24) var(--space-16); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-1); }
.empty { display:flex; flex-direction:column; align-items:center; gap:var(--space-8); max-width:280px; padding:var(--space-16); text-align:center; }
.empty__visual { width:64px; height:64px; border-radius:var(--radius-full); background:var(--color-surface-subtle); display:flex; align-items:center; justify-content:center; color:var(--color-text-tertiary); flex-shrink:0; }
.empty__title { margin:0; font:var(--type-heading); color:var(--color-text-primary); }
.empty__supporting { margin:0; font:var(--type-body-small); color:var(--color-text-secondary); }
.empty__actions { display:flex; flex-direction:column; align-items:center; gap:var(--space-8); margin-top:var(--space-8); }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 var(--space-16); border:0; border-radius:var(--radius-control); font:var(--type-label); cursor:pointer; }
.btn.primary { background:var(--color-primary); color:var(--color-on-primary); }
.text-action { background:none; border:0; padding:var(--space-8); font:var(--type-label); color:var(--color-text-brand); cursor:pointer; }
/* @component-css-end */
</style>
</head>
<body>
<div class="phone-list">
  <div class="phone" data-evidence-sample="first-use">
    <div class="empty">
      <div class="empty__visual" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      </div>
      <h3 class="empty__title">还没有任务</h3>
      <p class="empty__supporting">创建第一个任务后，它会出现在这里。</p>
      <div class="empty__actions"><button class="btn primary" type="button">新建任务</button></div>
    </div>
  </div>

  <div class="phone" data-evidence-sample="no-data">
    <div class="empty">
      <div class="empty__visual" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M8 3h8v4H8z"/></svg>
      </div>
      <h3 class="empty__title">暂无内容</h3>
      <p class="empty__supporting">当前还没有可展示的内容。</p>
    </div>
  </div>

  <div class="phone" data-evidence-sample="no-results">
    <div class="empty">
      <div class="empty__visual" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/><path d="m8.5 8.5 5 5m0-5-5 5"/></svg>
      </div>
      <h3 class="empty__title">未找到相关结果</h3>
      <p class="empty__supporting">没有符合当前关键词和筛选条件的结果。</p>
      <div class="empty__actions"><button class="text-action" type="button">调整筛选</button></div>
    </div>
  </div>
</div>
</body>
</html>
