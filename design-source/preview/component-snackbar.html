<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snackbar · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-12); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-text-primary); display: flex; justify-content: center; }
.specimen { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: var(--space-12); }
.story { display: flex; flex-direction: column; gap: var(--space-8); }
.story-label { font: var(--type-label-small); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
.caption { font: var(--type-caption); color: var(--color-text-tertiary); }
.device { position: relative; width: 390px; height: 320px; background: var(--color-background); border: var(--com-border-control) solid var(--color-border-subtle); border-radius: var(--radius-lg); overflow: hidden; flex-shrink: 0; }
.snackbar-stack { position: absolute; bottom: var(--space-16); left: var(--space-16); right: var(--space-16); display: flex; flex-direction: column; align-items: stretch; gap: var(--space-8); }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.snackbar { display: flex; align-items: center; gap: var(--space-8); max-width: min(360px, 100%); padding: var(--space-8) var(--space-8) var(--space-8) var(--space-12); background: var(--color-surface-inverse); color: var(--color-text-inverse); border-radius: var(--radius-control); box-shadow: var(--shadow-1); }
.snackbar-message { flex: 1; min-width: 0; font: var(--type-body-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snackbar__action { appearance: none; border: none; background: transparent; min-height: var(--size-control-height); padding: 0 var(--space-8); font: var(--type-label); color: var(--color-accent); white-space: nowrap; cursor: pointer; flex-shrink: 0; border-radius: var(--radius-xs); transition: background .15s, filter .15s; }
.snackbar__action:hover { filter: brightness(1.15); }
.snackbar__action:active { background: rgba(255,255,255,0.08); }
.snackbar__action:focus-visible { outline: var(--com-border-focus) solid var(--color-accent); outline-offset: var(--space-2); }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="story">
    <span class="story-label">Snackbar 轻提示操作</span>
    <p class="caption">Snackbar 至多一个操作,位于底部内容之上</p>
    <div class="device">
      <div class="snackbar-stack">
        <div class="snackbar" role="status" data-evidence-sample="with-action">
          <span class="snackbar-message">1 张照片已删除</span>
          <button class="snackbar__action" type="button">撤销</button>
        </div>
        <div class="snackbar" role="status" data-evidence-sample="network">
          <span class="snackbar-message">已离线,将在重新连接后同步</span>
          <button class="snackbar__action" type="button">重试</button>
        </div>
        <div class="snackbar" role="status" data-evidence-sample="message-only">
          <span class="snackbar-message">已复制到剪贴板</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
