<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline · com-design</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-family-base);color:var(--color-text-primary)}
  .specimen{display:flex;flex-direction:column;gap:20px;max-width:390px;margin:0 auto}
  .story{display:flex;flex-direction:column;gap:8px}
  .story-label{font:var(--type-label-small);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
  .timeline-surface{background:var(--color-surface);padding:var(--space-16)}
  .timeline--grayscale{filter:grayscale(1)}

  /* @component-css-start */
  .timeline{--tl-node-size:10px;--tl-node-offset:6px;--tl-event-gap:var(--space-12);display:flex;flex-direction:column}
  .tl-event{display:flex;align-items:flex-start;gap:var(--space-12);position:relative}
  .tl-event:not(:last-child) .tl-content{padding-bottom:var(--tl-event-gap)}
  .tl-rail{align-self:stretch;flex:0 0 auto;position:relative;width:var(--tl-node-size);display:flex;justify-content:center;padding-top:var(--tl-node-offset)}
  .tl-node{width:var(--tl-node-size);height:var(--tl-node-size);border-radius:var(--radius-full);background:var(--color-border-strong);flex-shrink:0;position:relative;z-index:1}
  .tl-event:not(:last-child) .tl-rail::after{content:"";position:absolute;top:calc(var(--tl-node-offset) + var(--tl-node-size));bottom:calc(-1 * var(--tl-node-offset));left:50%;width:2px;transform:translateX(-50%);background:var(--color-border-subtle);z-index:0}
  .tl-node.is-success{background:var(--color-success)}
  .tl-node.is-warning{background:var(--color-warning)}
  .tl-node.is-danger{background:var(--color-danger)}
  .tl-node.is-info{background:var(--color-info)}
  .tl-content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--space-2)}
  .tl-time{font:var(--type-caption);color:var(--color-text-tertiary);white-space:nowrap}
  .tl-title{font:var(--type-body);color:var(--color-text-primary);word-break:break-word}
  .tl-support{font:var(--type-body-small);color:var(--color-text-secondary);word-break:break-word}
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <section class="story">
    <span class="story-label">Mixed status · variable event height</span>
    <div class="timeline-surface" data-evidence-sample="variable-height">
      <div class="timeline">
        <div class="tl-event" data-evidence-event="success">
          <div class="tl-rail"><span class="tl-node is-success"></span></div>
          <div class="tl-content">
            <span class="tl-time">今天 14:32</span>
            <span class="tl-title">审批通过</span>
            <span class="tl-support">张维已通过你的请假申请。</span>
          </div>
        </div>
        <div class="tl-event" data-evidence-event="default-long">
          <div class="tl-rail"><span class="tl-node"></span></div>
          <div class="tl-content">
            <span class="tl-time">今天 10:05</span>
            <span class="tl-title">提交审批</span>
            <span class="tl-support">流程已送达主管，同时抄送项目负责人。这里故意使用更长的说明文本，验证支持文案换行、事件高度变大后，竖向 connector 仍从当前节点连续连接到下一节点。</span>
          </div>
        </div>
        <div class="tl-event" data-evidence-event="warning">
          <div class="tl-rail"><span class="tl-node is-warning"></span></div>
          <div class="tl-content">
            <span class="tl-time">昨天 16:48</span>
            <span class="tl-title">材料待补充</span>
            <span class="tl-support">请补充出差行程明细。</span>
          </div>
        </div>
        <div class="tl-event" data-evidence-event="danger-final">
          <div class="tl-rail"><span class="tl-node is-danger"></span></div>
          <div class="tl-content">
            <span class="tl-time">昨天 09:20</span>
            <span class="tl-title">驳回</span>
            <span class="tl-support">附件缺失，请重新提交。</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="story">
    <span class="story-label">Reduced-color readability</span>
    <div class="timeline-surface" data-evidence-sample="grayscale">
      <div class="timeline timeline--grayscale">
        <div class="tl-event">
          <div class="tl-rail"><span class="tl-node is-success"></span></div>
          <div class="tl-content"><span class="tl-time">14:32</span><span class="tl-title">审批通过</span></div>
        </div>
        <div class="tl-event">
          <div class="tl-rail"><span class="tl-node is-warning"></span></div>
          <div class="tl-content"><span class="tl-time">10:05</span><span class="tl-title">材料待补充</span></div>
        </div>
        <div class="tl-event">
          <div class="tl-rail"><span class="tl-node"></span></div>
          <div class="tl-content"><span class="tl-time">09:20</span><span class="tl-title">提交审批</span></div>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
