name: Design System Build

on:
  push:
    branches: [dev]
    paths:
      - 'design.md'
      - 'design-source/**'
      - 'tooling/**'
      - 'penpot/src/**'
      - 'penpot/bin/build.mjs'
      - 'package.json'
      - '.github/workflows/design-system-build.yml'
  pull_request:
    paths:
      - 'design.md'
      - 'design-source/**'
      - 'tooling/**'
      - 'penpot/src/**'
      - 'penpot/bin/build.mjs'
      - 'package.json'
      - '.github/workflows/design-system-build.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

      - name: Build all non-report targets
        run: npm run build:all

      - name: Verify acceptance report was not touched
        run: git diff --exit-code -- report/design-system-v1

      - name: Upload engineering adapters
        uses: actions/upload-artifact@v4
        with:
          name: com-design-engineering-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Penpot manifest
        uses: actions/upload-artifact@v4
        with:
          name: com-design-penpot-${{ github.sha }}
          path: penpot/build/manifest.json
          if-no-files-found: error
          retention-days: 30
