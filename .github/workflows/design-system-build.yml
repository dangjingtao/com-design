name: Design System Build

on:
  push:
    branches: [dev]
    paths:
      - 'design.md'
      - 'design-source/**'
      - 'docs/workbench/**'
      - 'tooling/**'
      - 'penpot/**'
      - 'report/design-system-v1/**'
      - 'package.json'
      - '.github/workflows/design-system-build.yml'
  pull_request:
    paths:
      - 'design.md'
      - 'design-source/**'
      - 'docs/workbench/**'
      - 'tooling/**'
      - 'penpot/**'
      - 'report/design-system-v1/**'
      - 'package.json'
      - '.github/workflows/design-system-build.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test

      - name: Run V2 deterministic validation
        id: validation
        continue-on-error: true
        run: npm run validate

      - name: Build engineering adapters and AI contract
        id: engineering_build
        continue-on-error: true
        run: npm run build:engineering

      - name: Build governed Penpot manifest
        id: penpot_build
        continue-on-error: true
        run: npm run build:penpot

      - name: Verify accepted report was not changed
        id: accepted_report
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Cannot determine a valid base SHA for accepted-report protection."
            exit 1
          fi
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- report/design-system-v1

      - name: Generate deterministic CI evidence
        if: always()
        env:
          GITHUB_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GATE_UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          GATE_VALIDATION: ${{ steps.validation.outcome }}
          GATE_ENGINEERING_BUILD: ${{ steps.engineering_build.outcome }}
          GATE_PENPOT_BUILD: ${{ steps.penpot_build.outcome }}
          GATE_ACCEPTED_REPORT: ${{ steps.accepted_report.outcome }}
        run: npm run ci:evidence

      - name: Run release governance dry-run
        if: always()
        run: npm run governance:dry-run

      - name: Upload deterministic evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com-design-evidence-${{ github.sha }}
          path: |
            dist/ci/evidence.json
            dist/governance/evidence.json
            dist/validation/evidence.json
            dist/design-model-v2.json
            dist/build-manifest.json
            dist/tailwind/adapter.json
            dist/native-mobile/adapter.json
            dist/wechat-mini-program/adapter.json
            dist/wechat-mini-program/tokens.js
            dist/agent/contract.json
            penpot/build/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload engineering adapters
        if: steps.engineering_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: com-design-engineering-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Penpot manifest
        if: steps.penpot_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: com-design-penpot-${{ github.sha }}
          path: penpot/build/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce deterministic hard gate result
        if: always()
        run: npm run ci:evidence -- --enforce
