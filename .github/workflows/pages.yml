name: Deploy Human Docs to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "report/design-system-v1/**"
      - "design-source/colors_and_type.css"
      - "design-source/components.css"
      - "design-source/components/**"
      - "design-source/preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Human Guide
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble Human Docs site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/design-source
          cp -R report/design-system-v1/. _site/
          cp design-source/colors_and_type.css _site/design-source/colors_and_type.css
          cp design-source/components.css _site/design-source/components.css
          cp -R design-source/components _site/design-source/components
          cp -R design-source/preview _site/design-source/preview
          touch _site/.nojekyll

      - name: Upload Human Guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
