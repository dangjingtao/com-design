name: Deploy Human Docs to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "report/design-system-v1/**"
      - "design-source/colors_and_type.css"
      - "design-source/components.css"
      - "design-source/components/**"
      - "design-source/preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build Human Guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble Human Docs site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/design-source
          cp -R report/design-system-v1/. _site/
          cp design-source/colors_and_type.css _site/design-source/colors_and_type.css
          cp design-source/components.css _site/design-source/components.css
          cp -R design-source/components _site/design-source/components
          cp -R design-source/preview _site/design-source/preview

          # Every deployment must reference fresh Human Guide CSS/JS.
          # GitHub Pages/browser caches otherwise make different revisions appear mixed together.
          BUILD_ID="${GITHUB_SHA::12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build = sys.argv[1]
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              'href="./guide-components.css"',
              f'href="./guide-components.css?v={build}"'
          )
          html = html.replace(
              'src="./guide-components.js"',
              f'src="./guide-components.js?v={build}"'
          )
          html = html.replace(
              '<div class="canvas-label">Standard Mobile Canvas · 390 × 844</div>',
              ''
          )
          html = html.replace(
              '</head>',
              f'  <meta name="com-design-build" content="{build}">\n</head>'
          )
          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Upload Human Guide artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish Human Guide
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
