name: Deploy Human Docs to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "report/design-system-v1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Human Guide
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Human Guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: report/design-system-v1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
