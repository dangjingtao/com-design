name: Deploy Human Docs to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "report/design-system-v1/**"
      - "design.md"
      - "design-source/**"
      - "tooling/**"
      - "penpot/src/**"
      - "penpot/bin/build.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build Human Guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build engineering delivery assets
        run: |
          npm test
          npm run build:engineering
          npm run build:penpot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble Human Docs site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/design-source/themes
          mkdir -p _site/downloads
          cp -R report/design-system-v1/. _site/
          cp design-source/colors_and_type.css _site/design-source/colors_and_type.css
          cp design-source/components.css _site/design-source/components.css
          cp -R design-source/themes/. _site/design-source/themes/
          cp -R design-source/components _site/design-source/components
          cp -R design-source/preview _site/design-source/preview

          # Publish engineering outputs built from the same design-source revision.
          cp -R dist/tailwind _site/downloads/tailwind
          cp -R dist/nativewind _site/downloads/nativewind
          cp -R dist/react-native _site/downloads/react-native
          cp -R dist/mcp _site/downloads/mcp
          cp dist/build-manifest.json _site/downloads/build-manifest.json
          cp penpot/build/manifest.json _site/downloads/penpot-manifest.json
          (
            cd dist
            zip -qr ../_site/downloads/com-design-engineering.zip tailwind nativewind react-native build-manifest.json
            zip -qr ../_site/downloads/com-design-mcp.zip mcp
          )

          # Theme-aware download kits. Human Guide switches its primary download together
          # with the active visual theme, while the universal Engineering Kit stays available.
          DEFAULT_PACK="$(mktemp -d)"
          PREMIUM_PACK="$(mktemp -d)"

          mkdir -p "$DEFAULT_PACK/design-source" "$DEFAULT_PACK/engineering" "$DEFAULT_PACK/penpot"
          cp design-source/colors_and_type.css "$DEFAULT_PACK/design-source/colors_and_type.css"
          cp -R dist/tailwind "$DEFAULT_PACK/engineering/tailwind"
          cp -R dist/nativewind "$DEFAULT_PACK/engineering/nativewind"
          cp -R dist/react-native "$DEFAULT_PACK/engineering/react-native"
          cp dist/build-manifest.json "$DEFAULT_PACK/engineering/build-manifest.json"
          cp penpot/build/manifest.json "$DEFAULT_PACK/penpot/manifest.json"
          cat > "$DEFAULT_PACK/README.md" <<'EOF'
          # Com Design Default Theme Kit

          Active visual baseline: Default / Electric Indigo.

          - Source: `design-source/colors_and_type.css`
          - Tailwind / NativeWind: generated from the same source revision
          - React Native: `tokens.color.light/dark` remain the default mapping
          - Penpot: use Default Light / Default Dark theme sets
          - Premium Gold remains compatible but is not activated by this kit
          EOF

          mkdir -p "$PREMIUM_PACK/design-source/themes" "$PREMIUM_PACK/engineering" "$PREMIUM_PACK/penpot"
          cp design-source/colors_and_type.css "$PREMIUM_PACK/design-source/colors_and_type.css"
          cp design-source/themes/premium-gold.css "$PREMIUM_PACK/design-source/themes/premium-gold.css"
          cp -R dist/tailwind "$PREMIUM_PACK/engineering/tailwind"
          cp -R dist/nativewind "$PREMIUM_PACK/engineering/nativewind"
          cp -R dist/react-native "$PREMIUM_PACK/engineering/react-native"
          cp dist/build-manifest.json "$PREMIUM_PACK/engineering/build-manifest.json"
          cp penpot/build/manifest.json "$PREMIUM_PACK/penpot/manifest.json"
          cat > "$PREMIUM_PACK/README.md" <<'EOF'
          # Com Design Premium Gold Theme Kit

          Active optional theme: Premium Gold / 土豪金.

          - Load `design-source/colors_and_type.css` first
          - Then load `design-source/themes/premium-gold.css`
          - Web scope: add `.theme-premium-gold` to the desired root/container
          - Tailwind / NativeWind generated theme.css includes the Premium Gold scope
          - React Native: use `tokens.themes.premiumGold`
          - Penpot: choose Premium Gold Light / Premium Gold Dark theme sets
          - Default Electric Indigo remains available and unchanged
          EOF

          (cd "$DEFAULT_PACK" && zip -qr "$GITHUB_WORKSPACE/_site/downloads/com-design-default-theme.zip" .)
          (cd "$PREMIUM_PACK" && zip -qr "$GITHUB_WORKSPACE/_site/downloads/com-design-premium-gold-theme.zip" .)

          # Trae Design / Agent source delivery. This intentionally publishes stable,
          # machine-readable source instead of coupling Com Design to a private project format.
          TRAE_SOURCE_PACK="$(mktemp -d)"
          cp -R design-source "$TRAE_SOURCE_PACK/design-source"
          cp design.md "$TRAE_SOURCE_PACK/design.md"
          mkdir -p "$TRAE_SOURCE_PACK/generated"
          cp -R dist/tailwind "$TRAE_SOURCE_PACK/generated/tailwind"
          cp -R dist/nativewind "$TRAE_SOURCE_PACK/generated/nativewind"
          cp -R dist/react-native "$TRAE_SOURCE_PACK/generated/react-native"
          cp -R dist/mcp "$TRAE_SOURCE_PACK/generated/mcp"
          cp dist/build-manifest.json "$TRAE_SOURCE_PACK/generated/build-manifest.json"
          cp penpot/build/manifest.json "$TRAE_SOURCE_PACK/generated/penpot-manifest.json"
          cat > "$TRAE_SOURCE_PACK/README.md" <<'EOF'
          # Com Design — Trae Design Source Kit

          This package is the stable source handoff for Trae Design and AI agents.
          It is intentionally not tied to a private editor project-file format.

          ## Contract

          - `design-source/` is the source of truth. Read it; do not fork or rewrite it locally.
          - `design.md` explains the human/agent usage contract.
          - `generated/` contains same-revision derived outputs for consumption and verification only.
          - Formal visual themes are Default and Premium Gold, each with Light / Dark mappings.
          - Premium Gold is one optional evolving theme, not a parallel versioned theme family.
          - Do not invent tokens when a semantic token or component contract already exists.

          If Trae Design introduces an official public native serializer later, that adapter can be
          added downstream without changing the Com Design source contract.
          EOF
          printf '\nBuild revision: `%s`\n' "$GITHUB_SHA" >> "$TRAE_SOURCE_PACK/README.md"
          (cd "$TRAE_SOURCE_PACK" && zip -qr "$GITHUB_WORKSPACE/_site/downloads/com-design-trae-source.zip" .)

          # Append Human Guide-only iframe compatibility rules after the main workspace script.
          # This keeps Core Preview pages untouched while fixing multi-scene evidence layouts in the simulator.
          printf '\n' >> _site/guide-components.js
          cat report/design-system-v1/guide-preview-adapter.js >> _site/guide-components.js

          # Foundation is flat-first: enforce a presentation guard after the main Foundation styles.
          printf '\n' >> _site/foundation.css
          cat report/design-system-v1/foundation-flat-guard.css >> _site/foundation.css

          # Every deployment references revisioned Human Guide assets.
          BUILD_ID="${GITHUB_SHA::12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build = sys.argv[1]
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              'href="./guide-components.css"',
              f'href="./guide-components.css?v={build}"'
          )
          html = html.replace(
              'href="./delivery.css"',
              f'href="./delivery.css?v={build}"'
          )
          html = html.replace(
              'href="./premium-gold.css"',
              f'href="./premium-gold.css?v={build}"'
          )
          html = html.replace(
              'src="./guide-components.js"',
              f'src="./guide-components.js?v={build}"'
          )
          html = html.replace(
              '<div class="canvas-label">Standard Mobile Canvas · 390 × 844</div>',
              ''
          )
          html = html.replace(
              '</head>',
              f'  <link rel="stylesheet" href="./foundation.css?v={build}">\n'
              f'  <link rel="stylesheet" href="./mobile-nav.css?v={build}">\n'
              f'  <link rel="stylesheet" href="./source-kit.css?v={build}">\n'
              f'  <script defer src="./theme-controller.js?v={build}"></script>\n'
              f'  <script defer src="./source-kit.js?v={build}"></script>\n'
              f'  <meta name="com-design-build" content="{build}">\n</head>'
          )
          html = html.replace(
              '</body>',
              f'  <script src="./foundation.js?v={build}"></script>\n'
              f'  <script src="./mobile-nav.js?v={build}"></script>\n</body>'
          )
          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Upload Human Guide artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish Human Guide
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
