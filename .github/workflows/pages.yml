name: Deploy Human Docs to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "report/design-system-v1/**"
      - "design.md"
      - "design-source/**"
      - "tooling/**"
      - "penpot/src/**"
      - "penpot/bin/build.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build Human Guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build engineering delivery assets
        run: |
          npm test
          npm run build:engineering
          npm run build:penpot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble Human Docs site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/design-source
          mkdir -p _site/downloads
          cp -R report/design-system-v1/. _site/
          cp design-source/colors_and_type.css _site/design-source/colors_and_type.css
          cp design-source/components.css _site/design-source/components.css
          cp -R design-source/components _site/design-source/components
          cp -R design-source/preview _site/design-source/preview

          # Publish engineering outputs built from the same design-source revision.
          cp -R dist/tailwind _site/downloads/tailwind
          cp -R dist/nativewind _site/downloads/nativewind
          cp -R dist/react-native _site/downloads/react-native
          cp -R dist/mcp _site/downloads/mcp
          cp dist/build-manifest.json _site/downloads/build-manifest.json
          cp penpot/build/manifest.json _site/downloads/penpot-manifest.json
          (
            cd dist
            zip -qr ../_site/downloads/com-design-engineering.zip tailwind nativewind react-native build-manifest.json
            zip -qr ../_site/downloads/com-design-mcp.zip mcp
          )

          # Append Human Guide-only iframe compatibility rules after the main workspace script.
          # This keeps Core Preview pages untouched while fixing multi-scene evidence layouts in the simulator.
          printf '\n' >> _site/guide-components.js
          cat report/design-system-v1/guide-preview-adapter.js >> _site/guide-components.js

          # Foundation is flat-first: enforce a presentation guard after the main Foundation styles.
          printf '\n' >> _site/foundation.css
          cat report/design-system-v1/foundation-flat-guard.css >> _site/foundation.css

          # Every deployment references revisioned Human Guide assets and exposes the generated MCP package.
          BUILD_ID="${GITHUB_SHA::12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build = sys.argv[1]
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              'href="./guide-components.css"',
              f'href="./guide-components.css?v={build}"'
          )
          html = html.replace(
              'href="./delivery.css"',
              f'href="./delivery.css?v={build}"'
          )
          html = html.replace(
              'src="./guide-components.js"',
              f'src="./guide-components.js?v={build}"'
          )
          html = html.replace(
              '<div class="canvas-label">Standard Mobile Canvas · 390 × 844</div>',
              ''
          )
          html = html.replace(
              'Tailwind、NativeWind、React Native Tokens 与 Penpot Manifest。',
              'Tailwind、NativeWind、React Native Tokens、Penpot Manifest 与 Agent 可调用的 MCP。'
          )
          html = html.replace(
              '<span><b>4 Targets</b>工程与设计工具输出</span>',
              '<span><b>5 Targets</b>工程、设计工具与 Agent 输出</span>'
          )

          mcp_card = '\n'.join([
              '          <article class="delivery-card">',
              '            <small>Agent Interface · MCP</small>',
              '            <h3>Com Design MCP</h3>',
              '            <p>面向 Codex、Claude、OpenCode 等 MCP Host 的只读设计系统接口。组件契约、Preview、Token 与 design.md 均来自本次同源构建。</p>',
              '            <a class="delivery-file" href="./downloads/com-design-mcp.zip" download>下载 MCP Package ↓</a>',
              '            <div class="delivery-links">',
              '              <a href="./downloads/mcp/README.md" target="_blank" rel="noopener">使用说明</a>',
              '              <a href="./downloads/mcp/data/mcp-manifest.json" target="_blank" rel="noopener">Source Manifest</a>',
              '            </div>',
              '          </article>',
          ])
          traceability = '\n'.join([
              '          <article class="delivery-card">',
              '            <small>Traceability · Build Record</small>',
          ])
          if 'downloads/com-design-mcp.zip' not in html:
              html = html.replace(traceability, mcp_card + '\n\n' + traceability)

          html = html.replace(
              '<b>同源：</b>Human Docs / Penpot / Tailwind / NativeWind / RN 都不互相反写。',
              '<b>同源：</b>Human Docs / Penpot / Tailwind / NativeWind / RN / MCP 都不互相反写。'
          )
          html = html.replace(
              '</head>',
              f'  <link rel="stylesheet" href="./foundation.css?v={build}">\n'
              f'  <link rel="stylesheet" href="./mobile-nav.css?v={build}">\n'
              f'  <style>.delivery-grid{{grid-template-columns:1.2fr 1fr 1fr 1fr}}@media(max-width:1100px){{.delivery-grid{{grid-template-columns:1fr 1fr}}}}@media(max-width:900px){{.delivery-grid{{grid-template-columns:1fr}}}}</style>\n'
              f'  <meta name="com-design-build" content="{build}">\n</head>'
          )
          html = html.replace(
              '</body>',
              f'  <script src="./foundation.js?v={build}"></script>\n'
              f'  <script src="./mobile-nav.js?v={build}"></script>\n</body>'
          )
          page.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Upload Human Guide artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish Human Guide
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
